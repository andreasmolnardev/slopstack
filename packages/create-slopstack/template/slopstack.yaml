schemaVersion: 1

app:
  name: slopstack
  goModule: github.com/andreasmolnardev/slopstack
  envPrefix: SLOPSTACK

runtime:
  port: 8090
  storagePath: pb_data

development:
  webPort: 5173
  apiProxyTarget: http://127.0.0.1:8090

tools:
  go: 1.27.1
  node: 22.23.2
  pnpm: 11.8.0
  air: 1.67.4
  dockerBuildx: 0.30.0

image:
  repository: ghcr.io/your-org/slopstack
  tag: "0.3.0"
  platforms: linux/amd64,linux/arm64

registry:
  host: ghcr.io

release:
  version: "0.3.0"
