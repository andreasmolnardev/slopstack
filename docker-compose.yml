services:
  starburst:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${STARBURST_PORT:-8090}:8090"
    env_file:
      - .env
    environment:
      SLOPSTACK_HTTP_ADDRESS: 0.0.0.0:8090
      SLOPSTACK_PUBLIC_URL: ${SLOPSTACK_PUBLIC_URL:-http://localhost:8090}
      SLOPSTACK_SECURE_COOKIES: ${SLOPSTACK_SECURE_COOKIES:-false}
      SLOPSTACK_STORAGE_PATH: /app/pb_data
      SLOPSTACK_DEVELOPMENT: "false"
    volumes:
      - starburst-data:/app/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  starburst-data:
    name: starburst-data
